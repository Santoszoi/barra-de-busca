<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Componente de busca responsivo com estados de interação e sugestões.">
  <title>Search UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <section class="demo" aria-labelledby="title">
    <p class="eyebrow">UI component</p>
    <h1 id="title">Busca rápida</h1>
    <p class="lead">Um componente de busca com foco em clareza, feedback e navegação por teclado.</p>
    <div class="search" role="search">
      <label class="sr-only" for="search-input">Buscar recursos</label>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
      <input id="search-input" autocomplete="off" placeholder="Buscar por projeto ou tecnologia">
      <button id="clear" type="button" aria-label="Limpar busca" hidden>×</button>
      <kbd>/</kbd>
    </div>
    <div id="suggestions" class="suggestions" aria-live="polite"></div>
    <p class="hint">Pressione <kbd>/</kbd> para focar a busca e <kbd>Esc</kbd> para limpar.</p>
  </section>
</main>
<script src="buscar.js"></script>
</body>
</html>
